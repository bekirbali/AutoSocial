services:
  postgres:
    image: postgres:16-alpine
    container_name: autosocial_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autosocial
      POSTGRES_PASSWORD: autosocial_dev
      POSTGRES_DB: autosocial
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autosocial"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autosocial_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autosocial_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - TZ=Europe/Istanbul
      - NODE_ENV=production
      - DATABASE_URL=postgresql://autosocial:autosocial_dev@postgres:5432/autosocial
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./output:/app/output
    command: sh -c "pnpm db:migrate && node dist/main.js"

volumes:
  postgres_data:
  redis_data:
